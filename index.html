<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>For Rose</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #04030a; overflow: hidden;
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }

  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 8vh 6vw 12vh;
    pointer-events: none;
    text-align: center;
  }

  #prompt {
    color: rgba(255,255,255,0.72);
    font-size: clamp(15px, 2.2vw, 19px);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 1.4s ease;
    margin-bottom: 28px;
  }
  #prompt.visible { opacity: 1; }
  #prompt.hidden-out { opacity: 0; transition: opacity 0.5s ease; }

  #ring-wrap {
    position: relative;
    width: 0; height: 0;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #ring-wrap.visible { opacity: 1; }
  #progress-ring { position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%) rotate(-90deg); }
  #progress-ring circle { fill: none; stroke-width: 2; }
  #ring-bg { stroke: rgba(255,255,255,0.12); }
  #ring-fg { stroke: #e9c9a8; stroke-linecap: round; transition: stroke-dashoffset 0.05s linear; }

  #rose-name {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #f4e6d8;
    font-size: clamp(36px, 8vw, 64px);
    letter-spacing: 0.25em;
    font-style: italic;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.8s ease;
    text-shadow: 0 0 32px rgba(233, 201, 168, 0.4);
    z-index: 10;
  }
  #rose-name.show { opacity: 1; }

  #flash {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255,235,215,0.9), rgba(255,235,215,0) 60%);
    opacity: 0; pointer-events: none;
  }

  #message {
    display: flex; flex-direction: column; gap: 10px;
    pointer-events: none;
  }
  #message p {
    margin: 0;
    color: #f4e6d8;
    font-size: clamp(20px, 4.2vw, 34px);
    letter-spacing: 0.01em;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.6s ease, transform 1.6s ease;
    text-shadow: 0 0 24px rgba(233, 201, 168, 0.35);
  }
  #message p.in { opacity: 1; transform: translateY(0); }
  #message p:first-child {
    font-size: clamp(16px, 2.6vw, 20px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(244, 230, 216, 0.7);
  }

  #skip {
    position: fixed; bottom: 18px; right: 18px;
    color: rgba(255,255,255,0.28);
    font-family: system-ui, sans-serif;
    font-size: 12px;
    letter-spacing: 0.05em;
    background: none; border: none;
    cursor: pointer;
    pointer-events: auto;
  }
  #skip:hover { color: rgba(255,255,255,0.55); }
</style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="rose-name">Rose</div>

  <div id="flash"></div>

  <div id="overlay">
    <div id="message">
      <p>Rose,</p>
      <p>Please accept this gesture as the key to my heart,</p>
      <p>I'm truly sorry.</p>
      <p>Please don't give up on me,</p>
      <p>and I do love you too!!</p>
    </div>

    <div id="ring-wrap">
      <svg id="progress-ring" width="120" height="120" viewBox="0 0 120 120">
        <circle id="ring-bg" cx="60" cy="60" r="50"></circle>
        <circle id="ring-fg" cx="60" cy="60" r="50" stroke-dasharray="314.159" stroke-dashoffset="314.159"></circle>
      </svg>
    </div>
    <div id="prompt">Hold to turn the key</div>
  </div>

  <button id="skip">skip</button>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from "three";

    // ---------------------------------------------------------------
    // Config — tune timings/feel here
    // ---------------------------------------------------------------
    const COUNT = window.innerWidth < 480 ? 3200 : 6200;
    const AMBIENT_MS = 4500; // longer ambient to show name
    const KEY_FORM_MS = 2000;
    const HOLD_MS = 1700;
    const EASE_BACK_MS = 550;
    const BURST_MS = 700;
    const HEART_FORM_MS = 2200;
    const MESSAGE_LINE_GAP_MS = 1300;
    const TURN_REVOLUTIONS = 1.15;

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // ---------------------------------------------------------------
    // Shape sampling (offscreen canvas -> fixed-length point cloud)
    // ---------------------------------------------------------------
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function sampleShapeToPoints(draw, count, size = 900, worldScale = 0.021) {
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.clearRect(0, 0, size, size);
      draw(ctx, size, size);

      const { data } = ctx.getImageData(0, 0, size, size);
      const candidates = [];
      const step = 2;
      for (let y = 0; y < size; y += step) {
        for (let x = 0; x < size; x += step) {
          if (data[(y * size + x) * 4 + 3] > 128) candidates.push({ x, y });
        }
      }
      shuffle(candidates);

      const points = new Float32Array(count * 3);
      if (candidates.length === 0) return points;

      for (let i = 0; i < count; i++) {
        let px, py;
        if (i < candidates.length) {
          px = candidates[i].x; py = candidates[i].y;
        } else {
          const c = candidates[i % candidates.length];
          px = c.x + (Math.random() - 0.5) * 3;
          py = c.y + (Math.random() - 0.5) * 3;
        }
        const ix = i * 3;
        points[ix] = (px - size / 2) * worldScale;
        points[ix + 1] = -(py - size / 2) * worldScale;
        points[ix + 2] = (Math.random() - 0.5) * 1.2;
      }
      return points;
    }

    function drawKey(ctx, w, h) {
      ctx.fillStyle = "#fff";
      const cx = w * 0.34, cy = h * 0.5;
      const outerR = w * 0.115, innerR = w * 0.052;

      ctx.beginPath(); ctx.arc(cx, cy, outerR, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath(); ctx.arc(cx, cy, innerR, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = "source-over";

      const shaftH = h * 0.05;
      const shaftX = cx + outerR - w * 0.01;
      const shaftW = w * 0.4;
      ctx.fillRect(shaftX, cy - shaftH / 2, shaftW, shaftH);

      const teethBaseX = shaftX + shaftW - w * 0.1;
      ctx.fillRect(teethBaseX, cy + shaftH / 2, w * 0.028, h * 0.045);
      ctx.fillRect(teethBaseX + w * 0.055, cy + shaftH / 2, w * 0.028, h * 0.075);
    }

    function drawHeart(ctx, w, h) {
      ctx.fillStyle = "#fff";
      const cx = w / 2, cy = h / 2 + h * 0.04;
      const scale = w * 0.0105;
      ctx.beginPath();
      for (let t = 0; t <= Math.PI * 2 + 0.01; t += 0.008) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        const px = cx + x * scale, py = cy + y * scale;
        if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    }

    const keyTarget = sampleShapeToPoints(drawKey, COUNT);
    const heartTarget = sampleShapeToPoints(drawHeart, COUNT);

    // ---------------------------------------------------------------
    // Scene
    // ---------------------------------------------------------------
    const canvas = document.getElementById("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 20);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const origin = new Float32Array(COUNT * 3);
    for (let i = 0; i < COUNT; i++) {
      const ix = i * 3, r = 28;
      origin[ix] = (Math.random() - 0.5) * r;
      origin[ix + 1] = (Math.random() - 0.5) * r;
      origin[ix + 2] = (Math.random() - 0.5) * r - 5;
    }

    const current = new Float32Array(origin);
    const velocities = new Float32Array(COUNT * 3); // used only during burst phase

    const coolColor = new THREE.Color(0xbfd4ff);
    const warmColor = new THREE.Color(0xf3b98a);
    const colors = new Float32Array(COUNT * 3);
    for (let i = 0; i < COUNT; i++) {
      coolColor.toArray(colors, i * 3);
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(current, 3));
    geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.1,
      vertexColors: true,
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });

    const points = new THREE.Points(geometry, material);
    scene.add(points);

    // ---------------------------------------------------------------
    // State machine
    // ---------------------------------------------------------------
    const promptEl = document.getElementById("prompt");
    const ringWrapEl = document.getElementById("ring-wrap");
    const ringFgEl = document.getElementById("ring-fg");
    const flashEl = document.getElementById("flash");
    const messageLines = Array.from(document.querySelectorAll("#message p"));
    const skipBtn = document.getElementById("skip");
    const roseNameEl = document.getElementById("rose-name");

    const RING_CIRC = 2 * Math.PI * 50;

    let phase = "ambient";
    let phaseStart = performance.now();
    let charge = 0;         // 0..1 while holding the key
    let holding = false;
    let holdStartCharge = 0;
    let burstFrom = null;   // captured positions at moment of unlock
    let unlockTime = 0;

    function setPhase(p) {
      phase = p;
      phaseStart = performance.now();
    }

    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

    function triggerUnlock() {
      burstFrom = new Float32Array(current);
      for (let i = 0; i < COUNT; i++) {
        const ix = i * 3;
        const dx = current[ix], dy = current[ix + 1], dz = current[ix + 2];
        const len = Math.hypot(dx, dy, dz) || 1;
        const speed = 6 + Math.random() * 6;
        velocities[ix] = (dx / len) * speed + (Math.random() - 0.5) * 2;
        velocities[ix + 1] = (dy / len) * speed + (Math.random() - 0.5) * 2;
        velocities[ix + 2] = (dz / len) * speed + (Math.random() - 0.5) * 2;
      }
      flashEl.style.transition = "opacity 0.08s ease";
      flashEl.style.opacity = "1";
      setTimeout(() => {
        flashEl.style.transition = "opacity 1.1s ease";
        flashEl.style.opacity = "0";
      }, 90);
      promptEl.classList.add("hidden-out");
      ringWrapEl.classList.remove("visible");
      setPhase("burst");
    }

    function revealMessage() {
      messageLines.forEach((el, i) => {
        setTimeout(() => el.classList.add("in"), i * MESSAGE_LINE_GAP_MS);
      });
    }

    // Pointer / touch handling — hold anywhere on screen to turn the key
    function onDown(e) {
      if (phase !== "ready" && phase !== "holding") return;
      holding = true;
      holdStartCharge = charge;
      if (phase === "ready") setPhase("holding");
    }
    function onUp() {
      if (phase !== "holding") return;
      holding = false;
    }
    window.addEventListener("pointerdown", onDown);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    window.addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });

    skipBtn.addEventListener("click", () => {
      if (phase === "burst" || phase === "toHeart" || phase === "message") return;
      triggerUnlock();
    });

    // ---------------------------------------------------------------
    // Render loop
    // ---------------------------------------------------------------
    const clock = new THREE.Clock();
    let time = 0;

    function tick() {
      const dt = Math.min(clock.getDelta(), 0.05);
      time += dt;
      const now = performance.now();
      const elapsed = now - phaseStart;

      const posAttr = geometry.getAttribute("position");
      const colAttr = geometry.getAttribute("color");

      if (phase === "ambient") {
        const drift = reduceMotion ? 0.05 : 1;
        for (let i = 0; i < COUNT; i++) {
          const ix = i * 3;
          current[ix] = origin[ix] + Math.sin(time * 0.5 + i) * 0.15 * drift;
          current[ix + 1] = origin[ix + 1] + Math.cos(time * 0.4 + i * 1.3) * 0.15 * drift;
          current[ix + 2] = origin[ix + 2];
        }
        
        if (elapsed > 400 && elapsed < 3200) {
          roseNameEl.classList.add("show");
        } else {
          roseNameEl.classList.remove("show");
        }

        if (elapsed > AMBIENT_MS) setPhase("toKey");

      } else if (phase === "toKey") {
        const t = easeInOut(Math.min(1, elapsed / KEY_FORM_MS));
        for (let i = 0; i < COUNT; i++) {
          const ix = i * 3;
          current[ix] = lerp(origin[ix], keyTarget[ix], t);
          current[ix + 1] = lerp(origin[ix + 1], keyTarget[ix + 1], t);
          current[ix + 2] = lerp(origin[ix + 2], keyTarget[ix + 2], t);
        }
        if (t > 0.6) {
          promptEl.classList.add("visible");
          ringWrapEl.classList.add("visible");
        }
        if (t >= 1) setPhase("ready");

      } else if (phase === "ready" || phase === "holding") {
        // idle key: gentle bob, rotation driven by charge
        if (holding) {
          charge = Math.min(1, charge + dt * (1000 / HOLD_MS));
        } else if (charge > 0) {
          charge = Math.max(0, charge - dt * (1000 / EASE_BACK_MS));
          if (phase === "holding" && charge === 0) setPhase("ready");
        }

        ringFgEl.setAttribute(
          "stroke-dashoffset",
          String(RING_CIRC * (1 - charge))
        );

        for (let i = 0; i < COUNT; i++) {
          const ix = i * 3;
          current[ix] = keyTarget[ix] + Math.sin(time * 0.6 + i) * 0.04;
          current[ix + 1] = keyTarget[ix + 1] + Math.cos(time * 0.5 + i * 1.4) * 0.04;
          current[ix + 2] = keyTarget[ix + 2];
        }
        points.rotation.z = -charge * Math.PI * 2 * TURN_REVOLUTIONS;
        const scalePulse = 1 + charge * 0.06;
        points.scale.setScalar(scalePulse);

        if (charge >= 1) triggerUnlock();

      } else if (phase === "burst") {
        const t = elapsed / BURST_MS;
        points.rotation.z = lerp(points.rotation.z, 0, Math.min(1, dt * 4));
        points.scale.setScalar(lerp(points.scale.x, 1, Math.min(1, dt * 4)));
        for (let i = 0; i < COUNT; i++) {
          const ix = i * 3;
          current[ix] += velocities[ix] * dt;
          current[ix + 1] += velocities[ix + 1] * dt;
          current[ix + 2] += velocities[ix + 2] * dt;
          // damping so the burst decelerates instead of flying off forever
          velocities[ix] *= 0.92;
          velocities[ix + 1] *= 0.92;
          velocities[ix + 2] *= 0.92;
        }
        if (t >= 1) {
          burstFrom = new Float32Array(current);
          setPhase("toHeart");
        }

      } else if (phase === "toHeart") {
        const t = easeOut(Math.min(1, elapsed / HEART_FORM_MS));
        for (let i = 0; i < COUNT; i++) {
          const ix = i * 3;
          current[ix] = lerp(burstFrom[ix], heartTarget[ix], t);
          current[ix + 1] = lerp(burstFrom[ix + 1], heartTarget[ix + 1], t);
          current[ix + 2] = lerp(burstFrom[ix + 2], heartTarget[ix + 2], t);

          const c1 = coolColor, c2 = warmColor;
          colors[ix] = lerp(c1.r, c2.r, t);
          colors[ix + 1] = lerp(c1.g, c2.g, t);
          colors[ix + 2] = lerp(c1.b, c2.b, t);
        }
        colAttr.needsUpdate = true;
        if (t >= 1) {
          setPhase("message");
          setTimeout(revealMessage, 300);
        }

      } else if (phase === "message") {
        const pulse = 1 + Math.sin(time * 1.1) * 0.015;
        for (let i = 0; i < COUNT; i++) {
          const ix = i * 3;
          current[ix] = heartTarget[ix] * pulse + Math.sin(time * 0.7 + i) * 0.02;
          current[ix + 1] = heartTarget[ix + 1] * pulse + Math.cos(time * 0.6 + i * 1.2) * 0.02;
          current[ix + 2] = heartTarget[ix + 2];
        }
      }

      posAttr.needsUpdate = true;

      camera.position.x = Math.sin(time * 0.08) * 0.6;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    tick();
  </script>
</body>
</html>
